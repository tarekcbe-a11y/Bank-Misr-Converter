<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تحويل العملات اللحظية - جروب عملاء البنوك المصرية</title>
    <!-- ربط ملف البيانات الخارجي للتحديث التلقائي -->
    <script src="rates.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            direction: rtl;
            text-align: right;
        }

        .converter-card {
            background-color: #111827;
            color: #f3f4f6;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #d4af37;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .header-branding {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        .logo-img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            background: transparent;
        }

        .group-title {
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
        }

        .converter-card h3 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #d1d5db;
            text-align: right;
        }

        .input-group input, 
        .input-group select {
            width: 100%;
            padding: 8px 10px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 13px;
            text-align: right;
            direction: rtl;
        }

        .input-group input:focus, 
        .input-group select:focus {
            border-color: #d4af37;
            outline: none;
        }

        .result-box {
            background: #1f2937;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px dashed #d4af37;
            margin-top: 15px;
        }

        .result-label {
            font-size: 12px;
            color: #9ca3af;
            display: block;
            margin-bottom: 4px;
        }

        #result {
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
        }

        .update-info {
            text-align: center;
            font-size: 10px;
            color: #9ca3af;
            margin-top: 10px;
        }

        .footer-divider {
            border: none;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            margin: 15px 0 10px 0;
        }

        .footer-branding {
            text-align: center;
        }

        .footer-group-name {
            color: #d4af37;
            font-size: 12px;
            margin-bottom: 3px;
        }

        .footer-developer {
            color: #d4af37;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="converter-card">
    <div class="header-branding">
        <img src="logo.png" alt="شعار الجروب" class="logo-img">
        <span class="group-title">جروب عملاء البنوك المصرية 🛡️</span>
    </div>

    <h3>💱 حاسبة تحويل العملات اللحظية</h3>
    
    <div class="input-group">
        <label>المبلغ:</label>
        <input type="number" id="amount" value="1" oninput="convertCurrency()">
    </div>

    <div class="input-group">
        <label>من عملة:</label>
        <select id="fromCurrency" onchange="convertCurrency()">
            <option value="USD">دولار أمريكي (USD)</option>
            <option value="EUR">يورو (EUR)</option>
            <option value="GBP">جنيه إسترليني (GBP)</option>
            <option value="SAR">ريال سعودي (SAR)</option>
            <option value="AED">درهم إماراتي (AED)</option>
            <option value="CHF">فرنك سويسري (CHF)</option>
            <option value="CAD">دولار كندي (CAD)</option>
            <option value="EGP">جنيه مصري (EGP)</option>
        </select>
    </div>

    <div class="input-group">
        <label>إلى عملة:</label>
        <select id="toCurrency" onchange="convertCurrency()">
            <option value="EGP">جنيه مصري (EGP)</option>
            <option value="USD">دولار أمريكي (USD)</option>
            <option value="EUR">يورو (EUR)</option>
            <option value="GBP">جنيه إسترليني (GBP)</option>
            <option value="SAR">ريال سعودي (SAR)</option>
            <option value="AED">درهم إماراتي (AED)</option>
            <option value="CHF">فرنك سويسري (CHF)</option>
            <option value="CAD">دولار كندي (CAD)</option>
        </select>
    </div>

    <div class="result-box">
        <span class="result-label">القيمة الناتجة:</span>
        <span id="result">0.00 EGP</span>
    </div>
    
    <div class="update-info" id="updateTime">
        آخر تحديث: 16 أغسطس 2026 - مرجع بنك مصر
    </div>

    <hr class="footer-divider">

    <div class="footer-branding">
        <div class="footer-group-name">جروب عملاء البنوك المصرية 🛡️</div>
        <div class="footer-developer">Developed by Tarek Metwally</div>
    </div>
</div>

<script>
    function convertCurrency() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const from = document.getElementById('fromCurrency').value;
        const to = document.getElementById('toCurrency').value;

        // الاعتماد على بيانات الأسعار القادمة من ملف rates.js الخارجي
        const amountInEGP = amount * window.rates[from];
        const finalResult = amountInEGP / window.rates[to];

        document.getElementById('result').innerText = 
            finalResult.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + to;
    }

    window.onload = function() {
        convertCurrency();
    };
</script>

</body>
</html>
