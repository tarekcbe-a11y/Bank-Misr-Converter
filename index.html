<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تحويل العملات - جروب عملاء البنوك المصرية</title>
    <style>
        body { background-color: #0b0f19; font-family: Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; direction: rtl; text-align: right; }
        .converter-card { background-color: #111827; color: #f3f4f6; padding: 20px; border-radius: 12px; border: 1px solid #d4af37; width: 100%; max-width: 340px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); box-sizing: border-box; }
        .header-branding { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(212, 175, 55, 0.3); }
        .logo-img { width: 30px; height: 30px; object-fit: contain; }
        .group-title { color: #ffffff; font-size: 13px; font-weight: bold; }
        .converter-card h3 { color: #d4af37; text-align: center; margin-bottom: 15px; font-size: 16px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; margin-bottom: 4px; font-size: 13px; color: #d1d5db; }
        .input-group input, .input-group select { width: 100%; padding: 8px 10px; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        .result-box { background: #1f2937; padding: 12px; border-radius: 8px; text-align: center; border: 1px dashed #d4af37; margin-top: 15px; }
        #result { font-size: 18px; font-weight: bold; color: #d4af37; }
        .update-info { text-align: center; font-size: 10px; color: #9ca3af; margin-top: 10px; }
        .footer-branding { text-align: center; margin-top: 10px; color: #d4af37; font-size: 12px; }
    </style>
</head>
<body>
<div class="converter-card">
    <div class="header-branding">
        <img src="logo.png" alt="Logo" class="logo-img">
        <span class="group-title">جروب عملاء البنوك المصرية 🛡️</span>
    </div>
    <h3>💱 حاسبة تحويل العملات اللحظية</h3>
    <div class="input-group">
        <label>المبلغ:</label>
        <input type="number" id="amount" value="1" oninput="convertCurrency()">
    </div>
    <div class="input-group">
        <label>من عملة:</label>
        <select id="fromCurrency" onchange="convertCurrency()"></select>
    </div>
    <div class="input-group">
        <label>إلى عملة:</label>
        <select id="toCurrency" onchange="convertCurrency()"></select>
    </div>
    <div class="result-box"><span id="result">0.00 EGP</span></div>
    <div class="update-info">آخر تحديث: 16 أغسطس 2026 - مرجع بنك مصر</div>
    <div class="footer-branding">جروب عملاء البنوك المصرية 🛡️<br>Developed by Tarek Metwally</div>
</div>
<script>
    const rates = {
        USD: 50.28,
        EUR: 58.00,
        GBP: 67.82,
        SAR: 13.375,
        AED: 13.683,
        KWD: 163.75,
        QAR: 13.78,
        BHD: 133.35,
        OMR: 130.65,
        JOD: 70.85,
        CHF: 61.77,
        CAD: 36.11,
        AUD: 33.50,
        JPY: 0.33,
        EGP: 1.00
    };

    function convertCurrency() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const from = document.getElementById('fromCurrency').value;
        const to = document.getElementById('toCurrency').value;
        const val = (amount * rates[from]) / rates[to];
        document.getElementById('result').innerText = val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + to;
    }

    const selects = [document.getElementById('fromCurrency'), document.getElementById('toCurrency')];
    Object.keys(rates).forEach(currency => {
        selects.forEach(sel => sel.add(new Option(currency, currency)));
    });
    window.onload = convertCurrency;
</script>
</body>
</html>
