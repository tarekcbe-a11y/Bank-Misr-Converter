<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار العملات - جروب عملاء البنوك المصرية</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #f59e0b;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-color: #38bdf8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Cairo', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(245, 158, 11, 0.3);
            padding-bottom: 15px;
        }

        .header h2 {
            color: var(--border-color);
            margin: 0;
            font-size: 20px;
        }

        .rates-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .rate-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .currency-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .flag {
            font-size: 24px;
        }

        .currency-names {
            display: flex;
            flex-direction: column;
        }

        .currency-code {
            font-weight: bold;
            font-size: 16px;
        }

        .currency-name {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .prices {
            display: flex;
            gap: 15px;
            text-align: left;
        }

        .price-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .price-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .price-value {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid rgba(245, 158, 11, 0.3);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>🇧🇭 جروب عملاء البنوك المصرية</h2>
            <p style="margin: 5px 0 0 0; font-size: 14px; color: var(--accent-color);">سعر صرف الجنيه المصري</p>
        </div>

        <div class="rates-list" id="ratesContainer">
            <!-- سيتم تعبئة البيانات تلقائياً -->
        </div>

        <div class="footer">
            جروب عملاء البنوك المصرية <br>
            <span style="font-size: 10px;">Developed by Tarek Metwally</span>
        </div>
    </div>

    <script>
        // بيانات أسعار العملات (الدولار في المقدمة)
        const exchangeRates = [
            { code: "USD", name: "دولار أمريكي", flag: "🇺🇸", buy: "50.23", sell: "50.33" },
            { code: "EUR", name: "يورو", flag: "🇪🇺", buy: "54.90", sell: "55.10" },
            { code: "SAR", name: "ريال سعودي", flag: "🇸🇦", buy: "13.34", sell: "13.40" },
            { code: "GBP", name: "جنيه إسترليني", flag: "🇬🇧", buy: "64.73", sell: "64.91" },
            { code: "AED", name: "درهم إماراتي", flag: "🇦🇪", buy: "13.66", sell: "13.70" },
            { code: "CHF", name: "فرنك سويسري", flag: "🇨🇭", buy: "58.66", sell: "58.88" },
            { code: "BHD", name: "دينار بحريني", flag: "🇧🇭", buy: "131.30", sell: "133.00" },
            { code: "KWD", name: "دينار كويتي", flag: "🇰🇼", buy: "163.20", sell: "164.50" },
            { code: "QAR", name: "ريال قطري", flag: "🇶🇦", buy: "13.75", sell: "13.82" },
            { code: "CNY", name: "يوان صيني", flag: "🇨🇳", buy: "7.04", sell: "7.10" }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("ratesContainer");
            container.innerHTML = "";
            
            exchangeRates.forEach(item => {
                const rateElement = document.createElement("div");
                rateElement.className = "rate-item";
                rateElement.innerHTML = `
                    <div class="currency-info">
                        <span class="flag">${item.flag}</span>
                        <div class="currency-names">
                            <span class="currency-code">${item.code}</span>
                            <span class="currency-name">${item.name}</span>
                        </div>
                    </div>
                    <div class="prices">
                        <div class="price-box">
                            <span class="price-label">شراء</span>
                            <span class="price-value">${item.buy}</span>
                        </div>
                        <div class="price-box">
                            <span class="price-label">بيع</span>
                            <span class="price-value">${item.sell}</span>
                        </div>
                    </div>
                `;
                container.appendChild(rateElement);
            });
        });
    </script>
</body>
</html>
