<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار العملات - جروب عملاء البنوك المصرية</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #f59e0b;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-color: #38bdf8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Cairo', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(245, 158, 11, 0.3);
            padding-bottom: 15px;
        }

        .header h2 {
            color: var(--border-color);
            margin: 0;
            font-size: 20px;
        }

        .rates-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .rate-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .currency-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .flag {
            font-size: 24px;
        }

        .currency-names {
            display: flex;
            flex-direction: column;
        }

        .currency-code {
            font-weight: bold;
            font-size: 16px;
        }

        .currency-name {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .prices {
            display: flex;
            gap: 15px;
            text-align: left;
        }

        .price-box {
            display: flex;
            flex-direction: column;
        }

        .price-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .price-value {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid rgba(245, 158, 11, 0.3);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>🇧🇭 جروب عملاء البنوك المصرية</h2>
            <p style="margin: 5px 0 0 0; font-size: 14px; color: var(--accent-color);">سعر صرف الجنيه المصري</p>
        </div>

        <div class="rates-list" id="ratesContainer">
            <!-- سيتم تعبئة البيانات برمجياً من ملف rates.js -->
        </div>

        <div class="footer">
            جروب عملاء البنوك المصرية <br>
            <span style="font-size: 10px;">Developed by Tarek Metwally</span>
        </div>
    </div>

    <!-- استدعاء ملف الأسعار اليومي -->
    <script src="rates.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("ratesContainer");
            
            if (typeof exchangeRates !== 'undefined') {
                exchangeRates.forEach(item => {
                    const rateElement = document.createElement("div");
                    rateElement.className = "rate-item";
                    rateElement.innerHTML = `
                        <div class="currency-info">
                            <span class="flag">${item.flag}</span>
                            <div class="currency-names">
                                <span class="currency-code">${item.code}</span>
                                <span class="currency-name">${item.name}</span>
                            </div>
                        </div>
                        <div class="prices">
                            <div class="price-box">
                                <span class="price-label">شراء</span>
                                <span class="price-value">${item.buy}</span>
                            </div>
                            <div class="price-box">
                                <span class="price-label">بيع</span>
                                <span class="price-value">${item.sell}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(rateElement);
                });
            } else {
                container.innerHTML = "<p style='text-align:center; color:red;'>تعذر تحميل بيانات الأسعار</p>";
            }
        });
    </script>
</body>
</html>
