<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حاسبة العملات - جروب عملاء البنوك المصرية</title>
    <style>
        body { background-color: #0b0f19; font-family: Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background-color: #111827; color: #f3f4f6; padding: 20px; border-radius: 16px; border: 1px solid #d4af37; width: 350px; }
        h3 { color: #d4af37; text-align: center; }
        .input-group { margin-bottom: 15px; }
        select, input { width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 8px; box-sizing: border-box; }
        .result { text-align: center; font-size: 18px; font-weight: bold; color: #d4af37; margin-top: 20px; }
    </style>
</head>
<body>
<div class="card">
    <h3>💱 حاسبة العملات</h3>
    <div class="input-group"><input type="number" id="amount" value="1" oninput="calc()"></div>
    <div class="input-group"><select id="from" onchange="calc()"></select></div>
    <div class="input-group"><select id="to" onchange="calc()"></select></div>
    <div class="result" id="res">0.00 جنيه</div>
</div>
<script src="rates.js"></script>
<script>
    const from = document.getElementById('from');
    const to = document.getElementById('to');
    for(let code in currencyData.rates) {
        let name = currencyData.rates[code].name;
        from.add(new Option(name, code));
        to.add(new Option(name, code));
    }
    from.value = "USD"; to.value = "EGP";
    function calc() {
        let val = document.getElementById('amount').value;
        let r = currencyData.rates;
        let res = (val * r[from.value].sell) / r[to.value].sell;
        document.getElementById('res').innerText = res.toLocaleString('en-US', {minimumFractionDigits: 2}) + " جنيه";
    }
    calc();
</script>
</body>
</html>
