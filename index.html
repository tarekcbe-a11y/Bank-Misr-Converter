<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول أسعار العملات - جروب عملاء البنوك المصرية</title>
    <style>
        body {
            background-color: #0b0f19;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            direction: rtl;
            text-align: right;
        }
        .card {
            background-color: #111827;
            color: #f3f4f6;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid #d4af37;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }
        .header-branding {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }
        .logo-img { width: 24px; height: 24px; object-fit: contain; }
        .group-title { color: #d4af37; font-size: 12px; font-weight: bold; }
        h3 { color: #d4af37; text-align: center; margin-bottom: 12px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #1f2937; }
        th { color: #d4af37; font-size: 12px; background-color: #1f2937; }
        td { color: #f8fafc; }
        .currency-name { text-align: right; }
        .update-info { text-align: center; font-size: 10px; color: #64748b; margin-top: 12px; }
        .footer-divider { border: none; border-top: 1px solid rgba(212, 175, 55, 0.3); margin: 12px 0 8px 0; }
        .footer-branding { text-align: center; color: #d4af37; font-size: 11px; }
        .footer-developer { color: #d4af37; font-size: 10px; margin-top: 2px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-branding">
        <img src="logo.png" alt="Logo" class="logo-img">
        <span class="group-title">جروب عملاء البنوك المصرية 🛡️</span>
    </div>
    <h3>📊 جدول أسعار العملات اللحظية</h3>
    <table>
        <thead>
            <tr>
                <th class="currency-name">العملة</th>
                <th>الشراء</th>
                <th>البيع</th>
            </tr>
        </thead>
        <tbody id="ratesTableBody"></tbody>
    </table>
    <div class="update-info" id="updateTime">آخر تحديث: 16 أغسطس 2026 - مرجع بنك مصر</div>
    <hr class="footer-divider">
    <div class="footer-branding">جروب عملاء البنوك المصرية 🛡️</div>
    <div class="footer-developer">Developed by Tarek Metwally</div>
</div>

<script>
    const ratesData = {
        updateDate: "16 أغسطس 2026",
        rates: {
            EGP: { name: "جنيه مصري", flag: "🇪🇬", buy: 1.00, sell: 1.00 },
            USD: { name: "دولار أمريكي", flag: "🇺🇸", buy: 50.18, sell: 50.28 },
            EUR: { name: "يورو", flag: "🇪🇺", buy: 57.85, sell: 58.00 },
            GBP: { name: "جنيه إسترليني", flag: "🇬🇧", buy: 67.65, sell: 67.82 },
            SAR: { name: "ريال سعودي", flag: "🇸🇦", buy: 13.34, sell: 13.38 },
            AED: { name: "درهم إماراتي", flag: "🇦🇪", buy: 13.65, sell: 13.68 },
            KWD: { name: "دينار كويتي", flag: "🇰🇼", buy: 163.10, sell: 163.75 }
        }
    };

    const tbody = document.getElementById('ratesTableBody');
    for (let code in ratesData.rates) {
        let item = ratesData.rates[code];
        tbody.innerHTML += `<tr><td class="currency-name">${item.flag} ${item.name}</td><td>${item.buy.toFixed(2)}</td><td>${item.sell.toFixed(2)}</td></tr>`;
    }
</script>
</body>
</html>
