<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حاسبة تحويل العملات المتقدمة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #050b14 0%, #0a192f 50%, #02060d 100%); 
            color: #f3f4f6; 
            padding: 15px 10px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            width: 100%; 
            overflow-x: hidden;
        }
        .converter-card { 
            background: linear-gradient(135deg, #0f2238 0%, #081220 50%, #0d1b2a 100%); 
            border: 2px solid #fbbf24; 
            border-radius: 18px; 
            padding: 20px 15px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 12px 35px rgba(0,0,0,0.9), 0 0 20px rgba(14, 165, 233, 0.25), inset 0 1px 2px rgba(255,255,255,0.15); 
            margin: 0 auto; 
        }
        .header-branding { text-align: center; margin-bottom: 12px; border-bottom: 1px solid rgba(251,191,36,0.3); padding-bottom: 8px; }
        .group-title { font-size: 1.05rem; font-weight: bold; color: #fbbf24; line-height: 1.4; word-break: break-word; }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 12px; font-size: 1.2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .input-group { margin-bottom: 12px; width: 100%; }
        label { display: block; margin-bottom: 5px; color: #7dd3fc; font-size: 0.88rem; font-weight: 600; text-align: right; }
        input, select { padding: 10px; width: 100%; background: #07111d; border: 1px solid #38bdf8; border-radius: 10px; color: #fff; font-size: 0.98rem; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); }
        input:focus, select:focus { border-color: #fbbf24; box-shadow: 0 0 10px rgba(251,191,36,0.4); }
        
        .results-container { display: flex; gap: 10px; margin: 12px 0; }
        .result-box { flex: 1; background: #060e18; border: 2px dashed #38bdf8; border-radius: 12px; padding: 10px 8px; text-align: center; box-shadow: inset 0 2px 5px rgba(0,0,0,0.7); }
        .result-box.sell { border-color: #fbbf24; }
        .result-label { display: block; color: #93c5fd; font-size: 0.8rem; margin-bottom: 4px; font-weight: 600; }
        .result-value { font-size: 1.15rem; font-weight: bold; color: #38bdf8; word-break: break-word; }
        .result-box.sell .result-value { color: #fbbf24; }

        .update-info { text-align: center; font-size: 0.73rem; color: #94a3b8; margin-bottom: 6px; }
        .source-note { text-align: center; font-size: 0.68rem; color: #38bdf8; opacity: 0.9; margin-bottom: 10px; }
        
        .footer-divider { border: 0; height: 1px; background: rgba(251,191,36,0.3); margin: 12px 0 8px 0; }
        .footer-branding { text-align: center; font-size: 0.78rem; }
        .footer-group-name { color: #fbbf24; font-weight: bold; margin-bottom: 2px; word-break: break-word; }
        .footer-dev { color: #38bdf8; font-size: 0.72rem; font-weight: 500; }
    </style>
</head>
<body>
<div class="converter-card">
    <div class="header-branding">
        <div class="group-title">جروب عملاء البنوك المصرية 🛡️</div>
    </div>

    <h2>حاسبة تحويل العملات المتقدمة</h2>
    
    <div class="input-group">
        <label>المبلغ</label>
        <input type="number" id="amount" value="1">
    </div>
    
    <div class="input-group">
        <label>من عملة</label>
        <select id="from"></select>
    </div>
    
    <div class="input-group">
        <label>إلى عملة</label>
        <select id="to"></select>
    </div>
    
    <div class="results-container">
        <div class="result-box">
            <span class="result-label">سعر الشراء 📉</span>
            <div id="buyResult" class="result-value">--</div>
        </div>
        <div class="result-box sell">
            <span class="result-label">سعر البيع 📈</span>
            <div id="sellResult" class="result-value">--</div>
        </div>
    </div>

    <div class="update-info" id="updateTime">--</div>
    <div class="source-note">طبقاً لأسعار بنك مصر</div>

    <hr class="footer-divider">
    <div class="footer-branding">
        <div class="footer-group-name">جروب عملاء البنوك المصرية 🛡️</div>
        <div class="footer-dev">Developed by Tarek Metwally</div>
    </div>
</div>

<script>
const currencies = [
    { code: "USD", name: "دولار أمريكي", flag: "🇺🇸" },
    { code: "EUR", name: "يورو", flag: "🇪🇺" },
    { code: "SAR", name: "ريال سعودي", flag: "🇸🇦" },
    { code: "GBP", name: "جنيه إسترليني", flag: "🇬🇧" },
    { code: "AED", name: "درهم إماراتي", flag: "🇦🇪" },
    { code: "CHF", name: "فرنك سويسري", flag: "🇨🇭" },
    { code: "AUD", name: "دولار أسترالي", flag: "🇦🇺" },
    { code: "BHD", name: "دينار بحريني", flag: "🇧🇭" },
    { code: "CAD", name: "دولار كندي", flag: "🇨🇦" },
    { code: "CNY", name: "يوان صيني", flag: "🇨🇳" },
    { code: "DKK", name: "كرونة دنماركية", flag: "🇩🇰" },
    { code: "JOD", name: "دينار أردني", flag: "🇯🇴" },
    { code: "EGP", name: "جنيه مصري", flag: "🇪🇬" }
];

const exchangeRates = {
    USD: { buy: 50.20, sell: 50.30 },
    EUR: { buy: 57.8600, sell: 58.2726 },
    SAR: { buy: 13.3337, sell: 13.398 },
    GBP: { buy: 67.6897, sell: 68.2118 },
    AED: { buy: 13.6544, sell: 13.696 },
    CHF: { buy: 61.6329, sell: 62.0681 },
    AUD: { buy: 30.4161, sell: 30.6878 },
    BHD: { buy: 131.221, sell: 133.422 },
    CAD: { buy: 36.0192, sell: 36.2784 },
    CNY: { buy: 7.44156, sell: 7.4628 },
    DKK: { buy: 7.7407, sell: 7.7907 },
    JOD: { buy: 70.3574, sell: 71.0452 },
    EGP: { buy: 1.00, sell: 1.00 }
};

const lastUpdatedText = "تاريخ التحديث: 2026-08-16 - 08:05 م";

document.addEventListener("DOMContentLoaded", () => {
    const fromSel = document.getElementById('from');
    const toSel = document.getElementById('to');
    const updateTimeEl = document.getElementById('updateTime');

    if (currencies && currencies.length > 0) {
        fromSel.innerHTML = '';
        toSel.innerHTML = '';
        currencies.forEach(c => {
            fromSel.innerHTML += `<option value="${c.code}">${c.flag} ${c.name} (${c.code})</option>`;
            toSel.innerHTML += `<option value="${c.code}">${c.flag} ${c.name} (${c.code})</option>`;
        });
        fromSel.value = "USD";
        toSel.value = "EGP";
    }

    function convert() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const from = fromSel.value;
        const to = toSel.value;

        const fromRateObj = exchangeRates[from] || { buy: 1, sell: 1 };
        const toRateObj = exchangeRates[to] || { buy: 1, sell: 1 };

        const buyValue = amount * (fromRateObj.buy / toRateObj.buy);
        const sellValue = amount * (fromRateObj.sell / toRateObj.sell);

        document.getElementById('buyResult').innerText = `${buyValue.toFixed(2)} ${to}`;
        document.getElementById('sellResult').innerText = `${sellValue.toFixed(2)} ${to}`;
        
        if (updateTimeEl) {
            updateTimeEl.textContent = lastUpdatedText;
        }
    }

    document.getElementById('amount').addEventListener('input', convert);
    fromSel.addEventListener('change', convert);
    toSel.addEventListener('change', convert);

    convert();
});
</script>
</body>
</html>
