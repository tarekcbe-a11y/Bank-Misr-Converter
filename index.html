<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تحويل العملات اللحظية - جروب عملاء البنوك المصرية</title>
    <script src="rates.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            direction: rtl;
            text-align: right;
        }

        .converter-card {
            background-color: #111827;
            color: #f3f4f6;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #d4af37;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        .header-branding {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        .logo-img {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }

        .group-title {
            color: #d4af37;
            font-size: 13px;
            font-weight: bold;
        }

        .converter-card h3 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #94a3b8;
        }

        .input-group input, 
        .input-group select {
            width: 100%;
            padding: 10px 12px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            text-align: right;
            direction: rtl;
            outline: none;
        }

        .input-group select:focus,
        .input-group input:focus {
            border-color: #d4af37;
        }

        .input-group select {
            appearance: auto;
            -webkit-appearance: menulist;
            -moz-appearance: menulist;
            cursor: pointer;
        }

        .result-box {
            background: #1f2937;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px dashed #d4af37;
            margin-top: 15px;
        }

        .result-label {
            font-size: 12px;
            color: #94a3b8;
            display: block;
            margin-bottom: 5px;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            color: #d4af37;
        }

        .update-info {
            text-align: center;
            font-size: 10px;
            color: #64748b;
            margin-top: 10px;
        }

        .footer-divider {
            border: none;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            margin: 15px 0 10px 0;
        }

        .footer-branding {
            text-align: center;
            color: #d4af37;
            font-size: 12px;
        }

        .footer-developer {
            color: #d4af37;
            font-size: 11px;
            margin-top: 2px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="converter-card">
    <div class="header-branding">
        <img src="logo.png" alt="Logo" class="logo-img">
        <span class="group-title">جروب عملاء البنوك المصرية 🛡️</span>
    </div>

    <h3>💱 حاسبة تحويل العملات اللحظية</h3>
    
    <div class="input-group">
        <label>المبلغ:</label>
        <input type="number" id="amount" value="1" oninput="convertCurrency()">
    </div>

    <div class="input-group">
        <label>من عملة:</label>
        <select id="fromCurrency" onchange="convertCurrency()"></select>
    </div>

    <div class="input-group">
        <label>إلى عملة:</label>
        <select id="toCurrency" onchange="convertCurrency()"></select>
    </div>

    <div class="result-box">
        <span class="result-label">القيمة الناتجة:</span>
        <span id="result">0.00 EGP</span>
    </div>
    
    <div class="update-info" id="updateTime">
        آخر تحديث: 16 أغسطس 2026 - مرجع بنك مصر
    </div>

    <hr class="footer-divider">

    <div class="footer-branding">جروب عملاء البنوك المصرية 🛡️</div>
    <div class="footer-developer">Developed by Tarek Metwally</div>
</div>

<script>
    function initConverter() {
        const data = window.currencyData;
        const rates = data.rates;
        
        const fromSelect = document.getElementById('fromCurrency');
        const toSelect = document.getElementById('toCurrency');

        fromSelect.innerHTML = '';
        toSelect.innerHTML = '';

        // بناء القوائم المنسدلة بالترتيب الموجود في ملف البيانات (يبدأ بالجنيه المصري)
        for (let code in rates) {
            let item = rates[code];
            let optionText = `${item.flag} ${item.name} (${code})`;
            
            fromSelect.add(new Option(optionText, code));
            toSelect.add(new Option(optionText, code));
        }

        // القيم الافتتاحية المطلوبة عند الفتح: من دولار أمريكي إلى جنيه مصري
        fromSelect.value = "USD";
        toSelect.value = "EGP";

        document.getElementById('updateTime').innerText = `آخر تحديث: ${data.updateDate} - مرجع بنك مصر`;
        convertCurrency();
    }

    function convertCurrency() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const from = document.getElementById('fromCurrency').value;
        const to = document.getElementById('toCurrency').value;
        const rates = window.currencyData.rates;

        const amountInEGP = amount * rates[from].value;
        const finalResult = amountInEGP / rates[to].value;

        document.getElementById('result').innerText = 
            finalResult.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + to;
    }

    window.onload = initConverter;
</script>

</body>
</html>
